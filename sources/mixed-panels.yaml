  tier: "secondary"
  kind: "article"
  parts: ["VIII", "IX", "X"]
  supports: "About 60,000 Germans serve as lay judges in criminal courts; a culture of consensus means formal votes are rare, though some judges apply the rule that lay judges vote first; lay judges 'need to be in a clear majority to have maximum influence', and in a minority 'lay participation is a mere formality'; two determined lay assessors can block a conviction under the two-thirds rule; 80% of surveyed Schöffen rated cooperation good; a lay assessor says the judge, asked how similar cases were decided, can 'decisively control and influence the decision-making'; lay judges tend to be middle class, well educated, close to parties and in their fifties and sixties; reading the file, being given room to speak and being younger helped a dissent prevail, while years of service did not matter; over 70% of Bochum and Frankfurt Schöffen thought some cases would have gone differently without lay judges."
