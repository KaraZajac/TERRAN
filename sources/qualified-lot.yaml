- id: "ietf/2020_rfc-8713"
  title: "RFC 8713: IAB, IESG, IETF Trust, and IETF LLC Selection, Confirmation, and Recall Process"
  authors: ["Murray Kucherawy", "Robert Hinden", "Jason Livingood"]
  publisher: "Internet Engineering Task Force (BCP 10)"
  date: "2020-02"
  url: "https://www.rfc-editor.org/rfc/rfc8713.txt"
  tier: "primary"
  kind: "report"
  parts: ["VIII"]
  supports: "The NomCom's ten voting volunteers are drawn at random from eligible volunteers by a method that uses random data unknown until the draw, is fair, unbiased and independently verifiable, and gives an ordered list; eligibility is three of the last five meetings (s. 4.14); members of the bodies the NomCom fills may not volunteer (s. 4.15); no more than two selected volunteers may share a primary affiliation (s. 4.17); NomCom members cannot be considered for positions their own committee fills (s. 5.11); candidates go to confirming bodies."
  checked:
    by: "claude"
    on: "2026-10-12"
    result: "verified"
    note: "Read the plain-text RFC at rfc-editor.org: sections 3.2, 4.3, 4.14-4.17 and 5.11."

- id: "ietf/2021_rfc-8989"
  title: "RFC 8989: Additional Criteria for Nominating Committee Eligibility"
  authors: ["Brian Carpenter", "Stephen Farrell"]
  publisher: "Internet Engineering Task Force (Experimental)"
  date: "2021-02"
  url: "https://www.rfc-editor.org/rfc/rfc8989.txt"
  tier: "primary"
  kind: "report"
  parts: ["VIII"]
  supports: "Process experiment adding alternative paths to NomCom eligibility: three of five meetings with online attendance counting for online meetings; working-group chair or secretary within three years; author or editor of two IETF-stream RFCs within five years. Rejected drafts, list mail, reviews and other criteria as 'not truly indicating effective IETF participation'; criteria must be measurable by the Secretariat, so 'no qualitative evaluation of an individual's contributions is considered'. August 2020 data: 842 eligible via attendance, 1,541 via chairing or authorship, 135 actual 2020 volunteers."
  checked:
    by: "claude"
    on: "2026-10-12"
    result: "verified"
    note: "Read the full RFC: sections 1-5 and Appendix A (Figures 1 and 2)."

- id: "ietf/2023_rfc-9389"
  title: "RFC 9389: Nominating Committee Eligibility"
  authors: ["Martin Duke"]
  publisher: "Internet Engineering Task Force (BCP 10)"
  date: "2023-04"
  url: "https://www.rfc-editor.org/rfc/rfc9389.txt"
  tier: "primary"
  kind: "report"
  parts: ["VIII"]
  supports: "Makes the three eligibility paths permanent, with online attendance meaning logging in to at least one session; in practice RFC 8713's rule had meant picking up a badge in person. Capture is 'the most potent threat'; counting remote attendance cut the cost of an eligible volunteer from three trips 'of around five days each' to 'zero financial cost'; an attacker needs 'roughly 60% of the volunteer pool' for even odds of six seats; a sudden surge is 'an early-warning sign'; one person can now qualify several identities, for which the RFC points to the recall procedure."
  checked:
    by: "claude"
    on: "2026-10-12"
    result: "verified"
    note: "Read the full RFC: sections 1-4."

